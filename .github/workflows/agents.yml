name: gh-agents

# Reusable workflow: PR review on demand (`/oc review`), `/oc` fix on
# comments, CI-failure diagnosis. Called via `uses: heliowap/gh-agents/.github/workflows/agents.yml@v1`
# with `secrets: inherit` (same owner) or explicit secret mapping (other
# owners — `inherit` does not cross owners). What this workflow is NOT:
#   - a merge gate. The reviewer comments; the human decides.
#   - an automatic reviewer. A PR is reviewed only when someone comments
#     `/oc review` on it (2026-09-28).
#   - CI auto-fix. ci-doctor diagnoses; fixing is a human decision or `/oc`.
#
# Agents/skills resolution: the caller's checkout is primary (`opencode.json`,
# `.agents/skills/`); the "seed" step copies this repo's defaults only where
# the caller has none. Untrusted values reach `run:` via `env:`, never ${{ }}.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label fallback; the caller's vars.AGENT_RUNNER wins."
        type: string
        default: "self-hosted"
      model:
        description: "OpenCode model for all agents, as provider/model or provider/model#variant (reasoning effort, e.g. #xhigh)."
        type: string
        default: "opencode-go/glm-5.3-flash"
      model_fallbacks:
        description: "Comma-separated provider/model fallbacks, live-probed in order; the first that answers is used."
        type: string
        default: ""
      allow_issue_fix:
        description: "Also run /oc fix on ordinary issues (uses the default branch); default is PR comments only."
        type: boolean
        default: false
      use_container:
        description: "Run jobs in the gh-agents-runtime image. false = host (repos whose tests need Docker; less isolation)."
        type: boolean
        default: true
      runtime_image:
        description: "Job image when use_container=true."
        type: string
        default: "ghcr.io/heliowap/gh-agents-runtime:v1"
      gh_agents_ref:
        description: "Ref for the gh-agents defaults checkout (agents/skills/scripts)."
        type: string
        default: "v1"
      ci_workflows:
        description: "Comma-separated workflow names ci-doctor watches, narrowed from the caller's `on.workflow_run.workflows` list. Empty = all of those — the trigger still needs every CI workflow named there."
        type: string
        default: ""
    # Which secret is required depends on the model's provider prefix —
    # the Preflight step in each job checks the right one. `required: false`
    # here so a fireworks-only caller isn't forced to set OPENCODE_API_KEY.
    secrets:
      OPENCODE_API_KEY:
        required: false
      FIREWORKS_API_KEY:
        required: false

permissions:
  contents: read

# Use a separate namespace from the caller job's group. If workflow-level
# concurrency applies to a called workflow, `/oc review` comments share a
# review lane and every other /oc comment a fix lane, so a review never waits
# behind (or interrupts) a fixer and fixers never push concurrently.
# Keep lanes and target expression aligned with both callers; the relation is
# checked by scripts/tests/test_caller_workflows.py.
concurrency:
  group: >-
    gh-agents-callee-${{ (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && (contains(github.event.comment.body, '/oc review') || contains(github.event.comment.body, '/opencode review')) && 'review' || (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && 'fix' || github.event_name }}-${{ github.event.pull_request.number
    || github.event.issue.number || github.event.workflow_run.id
    || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Container jobs default run: to `sh` (dash on ubuntu — no pipefail). Bash
# exists in the runtime image and on hosted runners, so pin it everywhere.
defaults:
  run:
    shell: bash

jobs:
  review:
    name: Review (${{ inputs.model }})
    # Manual only: a `/oc review` comment on a PR. Private repos accept it from
    # any human — only people with access can comment there, and the reviewer
    # only reads and comments. Public repos keep OWNER/MEMBER/COLLABORATOR.
    # Never a bot: no bot triggers a bot.
    if: >-
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
        || github.event_name == 'pull_request_review_comment')
      && github.event.comment.user.type != 'Bot'
      && (contains(github.event.comment.body, '/oc review') || contains(github.event.comment.body, '/opencode review'))
      && (github.event.repository.private
        || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ vars.AGENT_RUNNER || inputs.runs-on }}
    # vars.AGENT_OPENCODE_AUTH set = the runner host's opencode auth.json
    # (ChatGPT login) is mounted into the container (README: ChatGPT login)
    container: ${{ inputs.use_container && (vars.AGENT_OPENCODE_AUTH == '' && inputs.runtime_image || fromJSON(format('{{"image":"{0}","volumes":["{1}:/gh-agents/auth.json"]}}', inputs.runtime_image, vars.AGENT_OPENCODE_AUTH))) || '' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check PR is still open
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state=""
          for attempt in 1 2; do
            if state="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"; then
              break
            fi
            state=""
            [ "$attempt" -eq 2 ] || sleep 2
          done
          case "$state" in
            OPEN) echo "PR #${PR} is OPEN" ;;
            MERGED|CLOSED)
              echo "::error title=PR #${PR} ${state}::Review cannot run because PR #${PR} is ${state}."
              exit 1 ;;
            *)
              echo "::error title=PR state unavailable::Could not determine the state of PR #${PR}."
              exit 1 ;;
          esac
      - name: Resolve the PR head and base
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_KIND: ${{ github.event_name == 'pull_request_review_comment' && 'pulls/comments' || 'issues/comments' }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefName \
            --jq '"sha=\(.headRefOid)\nbase=\(.baseRefName)"' >> "$GITHUB_OUTPUT"
          # acknowledge the request; best-effort
          gh api -X POST "repos/${GITHUB_REPOSITORY}/${COMMENT_KIND}/${COMMENT_ID}/reactions" \
            -f content=eyes >/dev/null 2>&1 || true
      # The PR head, pinned to the SHA resolved above: the reviewer reads the
      # change and diffs it against origin/<base>. Nothing is pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heliowap/gh-agents
          ref: ${{ inputs.gh_agents_ref }}
          path: .gh-agents
          persist-credentials: false
      # In container jobs the workspace is owned by the host runner uid while
      # the image runs as root — git refuses foreign-owned repos, and opencode
      # then resolves a non-repo project root. Host jobs are unaffected.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The job holds the provider keys and the ChatGPT login, and anyone who
      # can comment may start it. Config that sets permissions or runs code at
      # startup (plugins, custom tools, MCP servers) comes from the base branch,
      # never from the PR under review; the PR's own copy stays readable in git.
      - name: Load agent config from the base branch
        id: config
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          exclude=.git/info/exclude
          echo "/.gh-agents/" >> "$exclude"
          for p in opencode.json opencode.jsonc .opencode .agents/skills; do
            rm -rf "$p"
            if git cat-file -e "origin/${BASE}:${p}" 2>/dev/null; then
              git checkout "origin/${BASE}" -- "$p"
              git reset -q -- "$p"
            fi
          done
          # caller's base-branch files win; a repo with nothing still works
          if [ ! -f opencode.json ] && [ ! -f opencode.jsonc ]; then
            cp .gh-agents/agents/opencode.json opencode.json
            echo "/opencode.json" >> "$exclude"
          fi
          for s in .gh-agents/skills/*/; do
            name="$(basename "$s")"
            if [ ! -d ".agents/skills/$name" ]; then
              mkdir -p .agents/skills
              cp -r "$s" ".agents/skills/$name"
              echo "/.agents/skills/$name/" >> "$exclude"
            fi
          done
      - name: Load ChatGPT login
        # opt-in via vars.AGENT_OPENCODE_AUTH: copies the host login to where
        # opencode reads it; the refreshed token is saved back after the run
        id: auth
        if: vars.AGENT_OPENCODE_AUTH != ''
        # A missing login may use a configured API-key fallback.
        continue-on-error: ${{ inputs.model_fallbacks != '' }}
        env:
          HOST_AUTH: ${{ inputs.use_container && '/gh-agents/auth.json' || vars.AGENT_OPENCODE_AUTH }}
        run: python3 .gh-agents/scripts/opencode_auth.py load "$HOST_AUTH" "${XDG_DATA_HOME:-$HOME/.local/share}/opencode/auth.json"
      - name: Preflight provider key
        id: preflight
        # Fork PRs and missing secrets arrive empty; any viable candidate
        # (primary or fallback) may proceed to the live probe.
        run: python3 .gh-agents/scripts/model_preflight.py
        env:
          MODEL: ${{ inputs.model }}
          FALLBACKS: ${{ inputs.model_fallbacks }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      - name: Ensure opencode CLI
        # the runtime image already carries it; host mode installs on demand
        run: |
          command -v opencode >/dev/null || {
            curl -fsSL https://opencode.ai/install | bash
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          }
      # Live-probe each candidate (primary then model_fallbacks, in order) with
      # a minimal real call — a 402/5xx is only caught by actually calling the
      # provider. The probe runs in a temp dir so opencode writes nothing into
      # the caller's worktree.
      - name: Resolve working model
        id: model
        env:
          MODEL: ${{ inputs.model }}
          FALLBACKS: ${{ inputs.model_fallbacks }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          set -uo pipefail
          IFS=',' read -ra candidates <<< "$MODEL,$FALLBACKS"
          probe="$(mktemp -d)"
          for m in "${candidates[@]}"; do
            m="${m//[[:space:]]/}"
            [ -z "$m" ] && continue
            # `provider/model#variant`: opencode v1 (what the action installs)
            # takes the reasoning effort as --variant, never inside --model
            base="${m%%#*}"; variant=""
            [[ "$m" != *"#"* ]] || variant="${m#*#}"
            echo "probing $m"
            if (cd "$probe" && timeout 120 opencode run --model "$base" ${variant:+--variant "$variant"} 'Reply with exactly: ok') >/dev/null 2>&1; then
              echo "model=$m" >> "$GITHUB_OUTPUT"
              echo "base=$base" >> "$GITHUB_OUTPUT"
              [ -z "$variant" ] || echo "variant=$variant" >> "$GITHUB_OUTPUT"
              echo "using $m"
              exit 0
            fi
            echo "::warning::$m did not respond — trying next candidate"
          done
          echo "::error::no candidate model responded — check provider keys and balances"
          exit 1
      - id: started
        run: |
          echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # `opencode run`, not the opencode GitHub action: the action refuses any
      # actor without write permission, and `/oc review` is open to read-only
      # users in private repos. We post the reviewer's final message ourselves.
      - id: review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          MODEL: ${{ steps.model.outputs.base }}
          VARIANT: ${{ steps.model.outputs.variant }}
          # global edit deny also covers the `general` subagents the reviewer
          # spawns, which don't inherit its permissions
          OPENCODE_CONFIG_CONTENT: '{"permission":{"edit":"deny"}}'
        run: |
          set -euo pipefail
          prompt="Review pull request #${PR} of ${GITHUB_REPOSITORY}. Output one review with three sections — \`BLOCKING\`, \`WARNING\`, \`NIT\` — each finding as \`path:line\` plus why it matters, \`(none)\` under empty sections, and a final line exactly \`SUMMARY: <n> BLOCKING, <n> WARNING, <n> NIT\`. Do not edit files."
          events="$(mktemp)"; review="$(mktemp)"
          # --pure: no external plugins in a job anyone with access can start
          opencode run --pure --format json --agent reviewer --model "$MODEL" ${VARIANT:+--variant "$VARIANT"} "$prompt" > "$events" || true
          if ! python3 .gh-agents/scripts/review_text.py < "$events" > "$review"; then
            echo "::error title=Review failed::opencode produced no review for PR #${PR}; see the step log"
            exit 1
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$review"
      - name: Save refreshed ChatGPT login
        # always: a failed run may still have rotated the refresh token
        if: always() && steps.auth.outcome == 'success'
        env:
          HOST_AUTH: ${{ inputs.use_container && '/gh-agents/auth.json' || vars.AGENT_OPENCODE_AUTH }}
        run: python3 .gh-agents/scripts/opencode_auth.py save "${XDG_DATA_HOME:-$HOME/.local/share}/opencode/auth.json" "$HOST_AUTH"
      # `--agent reviewer` is honoured by `opencode run` (the action ignored it,
      # #25); this still proves from the session itself that the run was the
      # reviewer. Root session only: subagents (`general`) run in child
      # sessions created later.
      - id: agent-check
        if: steps.review.outcome == 'success' || steps.review.outcome == 'failure'
        env:
          STARTED: ${{ steps.started.outputs.ts }}
          AGENT: reviewer
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016  # $d/$t are jq variables
          sid="$(opencode session list -n 50 --format json 2>/dev/null | jq -r --arg d "$PWD" --argjson t "$STARTED" '[.[] | select(.directory == $d and .created >= ($t * 1000) and (.parentID // null) == null)] | sort_by(.created) | .[0].id // empty')" || true
          if [ -z "$sid" ]; then
            echo "::warning title=Agent not verified::no opencode session from this run found; cannot prove the job ran as $AGENT"
            exit 0
          fi
          # to a file, as the annotate step does: piped, a large export reached
          # the parser as non-JSON (All-Medical/AllMedical run 36231334489)
          export_file="$(mktemp)"
          opencode export "$sid" > "$export_file" 2>/dev/null || true
          rc=0
          out="$(python3 .gh-agents/scripts/session_agent.py --expect "$AGENT" < "$export_file")" || rc=$?
          echo "$out"
          case "$rc" in
            0) ;;
            2) echo "::warning title=Agent not verified::$out (session $sid, export $(wc -c < "$export_file") bytes)"
               head -c 300 "$export_file"; echo ;;
            *) echo "::error title=Agent not pinned::$out — the $AGENT sandbox did not apply (heliowap/gh-agents#25)"; exit 1 ;;
          esac
      # Cost attribution on the review comment itself: the review step posts as
      # github-actions[bot] and opencode writes the session under $HOME; we read the
      # newest session's usage and append a footer. Best-effort — a failure
      # here must never fail the review.
      - name: Annotate review comment with usage
        if: steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          STARTED: ${{ steps.started.outputs.ts }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          set -uo pipefail
          # HOME do self-hosted persiste entre runs — created >= STARTED
          # impede pegar a sessão de um /oc concorrente no mesmo workspace.
          sid="$(opencode session list -n 20 --format json 2>/dev/null | jq -r --arg d "$PWD" --argjson t "$STARTED" '[.[] | select(.directory == $d and .created >= ($t * 1000))][0].id // empty')" || true
          meta=""
          if [ -n "$sid" ]; then
            export_file="$(mktemp)"
            opencode export "$sid" > "$export_file" 2>/dev/null || true
            meta="$(python3 - "$export_file" <<'PY' 2>/dev/null || true
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              msgs=d.get("messages",[])
          except Exception:
              sys.exit(0)
          tok=0; cost=0.0; prov=model=None
          for m in msgs:
              if not isinstance(m,dict): continue
              i=m.get("info",{})
              if not isinstance(i,dict): continue
              t=i.get("tokens")
              if not isinstance(t,dict): continue
              tok+=t.get("total",0); cost+=i.get("cost",0.0) or 0.0
              prov=i.get("providerID") or prov; model=i.get("modelID") or model
          if prov and model:
              print(f"{prov}/{model}|{tok}|{cost:.4f}")
          PY
          )"
          fi
          now="$(date +%s)"
          dur=$(( now - STARTED ))
          # Use the same valid-summary parser as the BLOCKING gate. Paginate
          # so a current review after comment 100 is still visible.
          cid="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            | jq -s add | PYTHONPATH=.gh-agents/scripts python3 -c '
          import json, os, sys
          from datetime import datetime
          from review_blocking import latest_review
          review = latest_review(json.load(sys.stdin) or [], datetime.fromisoformat(os.environ["SINCE"]))
          print((review or {}).get("id", ""))
          ')" || true
          [ -n "$cid" ] || { echo "no review comment found to annotate"; exit 0; }
          IFS='|' read -r model tok cost <<<"$meta"
          mins=$(( dur / 60 )); secs=$(( dur % 60 ))
          footer="<sub>review by ${model:-unknown} · ${mins}m${secs}s$( [ -n "$tok" ] && printf ' · %s tokens' "$tok" )$( [ -n "$cost" ] && printf ' · $%s' "$cost" )</sub>"
          body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" --jq .body)" || true
          [ -n "$body" ] || { echo "comment body fetch failed; skipping"; exit 0; }
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" -f body="$body
          
          $footer" >/dev/null || { echo "PATCH failed"; exit 0; }
          echo "annotated comment $cid"
      # BLOCKING becomes a `review-blocking` issue; WARNING/NIT do not. One
      # issue per PR (key `PR #N` in title); a closed one reopens on new
      # BLOCKING. Only when the review posted — a failed review has no SUMMARY.
      - id: blocking
        name: BLOCKING becomes a review-blocking issue
        if: steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          # --since: only this run's review counts. Without the cutoff an
          # off-format review fell back to the previous SHA's one and its count
          # was reported against the new SHA (intrador #1415).
          out="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            | jq -s add | python3 .gh-agents/scripts/review_blocking.py --comments --since "$SINCE")"
          if [ "$(jq -r .summary <<<"$out")" != "ok" ]; then
            # not a gate: a warning for the human to read the review, never a red check
            echo "::warning title=Review off-format::no 'SUMMARY: N BLOCKING, N WARNING, N NIT' line in this run's review of PR #${PR}; BLOCKING count unknown — read the review comment"
            exit 0
          fi
          blocking="$(jq -r .blocking <<<"$out")"
          if [ "$blocking" = "0" ]; then
            echo "no BLOCKING on PR #${PR}"
            exit 0
          fi
          block_text="$(jq -r .block <<<"$out" | sed 's/^/    /')"
          # shellcheck disable=SC2016 # backticks in the format string are literal markdown
          body="$(printf 'Review of PR #%s (SHA `%s`) ended with %s BLOCKING.\n\nComment: %s\n\n    BLOCKING\n%s\n\nTriage: `/oc <request>` on PR #%s, or close if not pertinent.\n' \
            "$PR" "$SHA" "$blocking" "$(jq -r .url <<<"$out")" "$block_text" "$PR")"
          # workflows that use a label guarantee the label
          gh label create review-blocking --color B60205 \
            --description "Review reported BLOCKING" --force >/dev/null
          # client-side filter, not --search: the Search API lags and a
          # `synchronize` right after creation would open a duplicate
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&labels=review-blocking&per_page=100" \
            | jq -s --arg pr "PR #${PR} " 'add | map(select(.pull_request == null and (.title | contains($pr)))) | .[0] // {}')"
          number="$(jq -r '.number // empty' <<<"$existing")"
          if [ -n "$number" ]; then
            [ "$(jq -r .state <<<"$existing")" = "closed" ] && gh issue reopen "$number"
            gh issue comment "$number" --body "$body"
            echo "issue #${number} updated"
            exit 0
          fi
          gh issue create --label review-blocking \
            --title "review-blocking: PR #${PR} with BLOCKING in review" \
            --body "$body"

  fix:
    name: Fix (/oc)
    # Comments are untrusted input: only OWNER/MEMBER/COLLABORATOR may fix
    # a PR or issue, never a bot (a bot must not trigger a bot).
    # The fixer pushes, so it stays collaborator-only; `/oc review` is the
    # review job's.
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request != null || inputs.allow_issue_fix)
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
      && !contains(github.event.comment.body, '/oc review')
      && !contains(github.event.comment.body, '/opencode review')
    runs-on: ${{ vars.AGENT_RUNNER || inputs.runs-on }}
    # vars.AGENT_OPENCODE_AUTH set = the runner host's opencode auth.json
    # (ChatGPT login) is mounted into the container (README: ChatGPT login)
    container: ${{ inputs.use_container && (vars.AGENT_OPENCODE_AUTH == '' && inputs.runtime_image || fromJSON(format('{{"image":"{0}","volumes":["{1}:/gh-agents/auth.json"]}}', inputs.runtime_image, vars.AGENT_OPENCODE_AUTH))) || '' }}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check PR is still open
        id: pr-state
        # Ordinary issue commands work on the default branch; only PRs have
        # a state to check before pushing to their head branch.
        if: github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          state=""
          for attempt in 1 2; do
            if state="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"; then
              break
            fi
            state=""
            [ "$attempt" -eq 2 ] || sleep 2
          done
          case "$state" in
            OPEN) echo "PR #${PR} is OPEN" ;;
            MERGED|CLOSED)
              echo "::error title=PR #${PR} ${state}::Fix cannot run because PR #${PR} is ${state}."
              exit 1 ;;
            *)
              echo "::error title=PR state unavailable::Could not determine the state of PR #${PR}."
              exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heliowap/gh-agents
          ref: ${{ inputs.gh_agents_ref }}
          path: .gh-agents
          persist-credentials: false
      # see review job — containers need the workspace marked safe for git
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Seed opencode.json and fallback skills
        run: |
          set -euo pipefail
          # seeded files must stay invisible to `git status` — the opencode
          # action commits+pushes a dirty worktree onto the caller's branch
          exclude=.git/info/exclude
          echo "/.gh-agents/" >> "$exclude"
          if [ ! -f opencode.json ]; then
            cp .gh-agents/agents/opencode.json opencode.json
            echo "/opencode.json" >> "$exclude"
          fi
          for s in .gh-agents/skills/*/; do
            name="$(basename "$s")"
            if [ ! -d ".agents/skills/$name" ]; then
              mkdir -p .agents/skills
              cp -r "$s" ".agents/skills/$name"
              echo "/.agents/skills/$name/" >> "$exclude"
            fi
          done
      - name: Load ChatGPT login
        # opt-in via vars.AGENT_OPENCODE_AUTH: copies the host login to where
        # opencode reads it; the refreshed token is saved back after the run
        id: auth
        if: vars.AGENT_OPENCODE_AUTH != ''
        continue-on-error: ${{ inputs.model_fallbacks != '' }}
        env:
          HOST_AUTH: ${{ inputs.use_container && '/gh-agents/auth.json' || vars.AGENT_OPENCODE_AUTH }}
        run: python3 .gh-agents/scripts/opencode_auth.py load "$HOST_AUTH" "${XDG_DATA_HOME:-$HOME/.local/share}/opencode/auth.json"
      - name: Preflight provider key
        id: preflight
        run: python3 .gh-agents/scripts/model_preflight.py
        env:
          MODEL: ${{ inputs.model }}
          FALLBACKS: ${{ inputs.model_fallbacks }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      - name: Ensure opencode CLI
        # the runtime image already carries it; host mode installs on demand
        run: |
          command -v opencode >/dev/null || {
            curl -fsSL https://opencode.ai/install | bash
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          }
      - name: Resolve working model
        id: model
        env:
          MODEL: ${{ inputs.model }}
          FALLBACKS: ${{ inputs.model_fallbacks }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          set -uo pipefail
          IFS=',' read -ra candidates <<< "$MODEL,$FALLBACKS"
          probe="$(mktemp -d)"
          for m in "${candidates[@]}"; do
            m="${m//[[:space:]]/}"
            [ -z "$m" ] && continue
            # `provider/model#variant`: opencode v1 (what the action installs)
            # takes the reasoning effort as --variant, never inside --model
            base="${m%%#*}"; variant=""
            [[ "$m" != *"#"* ]] || variant="${m#*#}"
            echo "probing $m"
            if (cd "$probe" && timeout 120 opencode run --model "$base" ${variant:+--variant "$variant"} 'Reply with exactly: ok') >/dev/null 2>&1; then
              echo "model=$m" >> "$GITHUB_OUTPUT"
              echo "base=$base" >> "$GITHUB_OUTPUT"
              [ -z "$variant" ] || echo "variant=$variant" >> "$GITHUB_OUTPUT"
              echo "using $m"
              exit 0
            fi
            echo "::warning::$m did not respond — trying next candidate"
          done
          echo "::error::no candidate model responded — check provider keys and balances"
          exit 1
      - id: started
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: fix
        uses: anomalyco/opencode/github@3a103fe0aff726a4edc7492f03f7b88195d9e4c9 # v2.0.16
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action commits whatever the agent produced; jobs have no git identity
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          # the CLI ignores `agent:` below (#25); inline config wins over the
          # caller's opencode.json
          OPENCODE_CONFIG_CONTENT: '{"default_agent":"fixer"}'
        with:
          model: ${{ steps.model.outputs.base }}
          variant: ${{ steps.model.outputs.variant }}
          agent: fixer
          use_github_token: true
          share: false
      - name: Save refreshed ChatGPT login
        # always: a failed run may still have rotated the refresh token
        if: always() && steps.auth.outcome == 'success'
        env:
          HOST_AUTH: ${{ inputs.use_container && '/gh-agents/auth.json' || vars.AGENT_OPENCODE_AUTH }}
        run: python3 .gh-agents/scripts/opencode_auth.py save "${XDG_DATA_HOME:-$HOME/.local/share}/opencode/auth.json" "$HOST_AUTH"
      # `opencode github run` ignores the `agent:` input and falls back to
      # `default_agent`, then `build` — no sandbox (#25). OPENCODE_CONFIG_CONTENT
      # pins it; this proves from the session itself that the pin held, since the
      # action installs the latest CLI on every run. Root session only: subagents
      # (`general`) run in child sessions created later.
      - id: agent-check
        if: steps.fix.outcome == 'success' || steps.fix.outcome == 'failure'
        env:
          STARTED: ${{ steps.started.outputs.ts }}
          AGENT: fixer
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016  # $d/$t are jq variables
          sid="$(opencode session list -n 50 --format json 2>/dev/null | jq -r --arg d "$PWD" --argjson t "$STARTED" '[.[] | select(.directory == $d and .created >= ($t * 1000) and (.parentID // null) == null)] | sort_by(.created) | .[0].id // empty')" || true
          if [ -z "$sid" ]; then
            echo "::warning title=Agent not verified::no opencode session from this run found; cannot prove the job ran as $AGENT"
            exit 0
          fi
          # to a file, as the annotate step does: piped, a large export reached
          # the parser as non-JSON (All-Medical/AllMedical run 36231334489)
          export_file="$(mktemp)"
          opencode export "$sid" > "$export_file" 2>/dev/null || true
          rc=0
          out="$(python3 .gh-agents/scripts/session_agent.py --expect "$AGENT" < "$export_file")" || rc=$?
          echo "$out"
          case "$rc" in
            0) ;;
            2) echo "::warning title=Agent not verified::$out (session $sid, export $(wc -c < "$export_file") bytes)"
               head -c 300 "$export_file"; echo ;;
            *) echo "::error title=Agent not pinned::$out — the $AGENT sandbox did not apply (heliowap/gh-agents#25)"; exit 1 ;;
          esac

  ci-doctor:
    name: CI doctor
    # Failed workflow_run; empty ci_workflows watches all runs the caller's
    # workflow_run trigger woke (diagnose-only; fixing is /oc or human).
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'failure'
      && (inputs.ci_workflows == '' || contains(inputs.ci_workflows, github.event.workflow_run.name))
    runs-on: ${{ vars.AGENT_RUNNER || inputs.runs-on }}
    # vars.AGENT_OPENCODE_AUTH set = the runner host's opencode auth.json
    # (ChatGPT login) is mounted into the container (README: ChatGPT login)
    container: ${{ inputs.use_container && (vars.AGENT_OPENCODE_AUTH == '' && inputs.runtime_image || fromJSON(format('{{"image":"{0}","volumes":["{1}:/gh-agents/auth.json"]}}', inputs.runtime_image, vars.AGENT_OPENCODE_AUTH))) || '' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heliowap/gh-agents
          ref: ${{ inputs.gh_agents_ref }}
          path: .gh-agents
          persist-credentials: false
      # see review job — containers need the workspace marked safe for git
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Seed opencode.json and fallback skills
        run: |
          set -euo pipefail
          # seeded files must stay invisible to `git status` — the opencode
          # action commits+pushes a dirty worktree onto the caller's branch
          exclude=.git/info/exclude
          echo "/.gh-agents/" >> "$exclude"
          if [ ! -f opencode.json ]; then
            cp .gh-agents/agents/opencode.json opencode.json
            echo "/opencode.json" >> "$exclude"
          fi
          for s in .gh-agents/skills/*/; do
            name="$(basename "$s")"
            if [ ! -d ".agents/skills/$name" ]; then
              mkdir -p .agents/skills
              cp -r "$s" ".agents/skills/$name"
              echo "/.agents/skills/$name/" >> "$exclude"
            fi
          done
      - name: Load ChatGPT login
        # opt-in via vars.AGENT_OPENCODE_AUTH: copies the host login to where
        # opencode reads it; the refreshed token is saved back after the run
        id: auth
        if: vars.AGENT_OPENCODE_AUTH != ''
        continue-on-error: ${{ inputs.model_fallbacks != '' }}
        env:
          HOST_AUTH: ${{ inputs.use_container && '/gh-agents/auth.json' || vars.AGENT_OPENCODE_AUTH }}
        run: python3 .gh-agents/scripts/opencode_auth.py load "$HOST_AUTH" "${XDG_DATA_HOME:-$HOME/.local/share}/opencode/auth.json"
      - name: Preflight provider key
        id: preflight
        run: python3 .gh-agents/scripts/model_preflight.py
        env:
          MODEL: ${{ inputs.model }}
          FALLBACKS: ${{ inputs.model_fallbacks }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      # Dedup is deterministic, not LLM-decided: one diagnosis per (run, sha),
      # keyed by the <!-- ci-doctor:<sha> --> marker the agent must append.
      - name: Resolve PR and dedup
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                --jq '.pull_requests[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "run ${RUN_ID} has no associated PR; ci-doctor skips silently"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dup="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" \
            | jq -s --arg m "<!-- ci-doctor:${HEAD_SHA} -->" \
              'add | map(select(.body | contains($m))) | length')"
          if [ "$dup" != "0" ]; then
            echo "diagnosis for ${HEAD_SHA} already posted on PR #${pr}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "pr=${pr}"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
      - name: Ensure opencode CLI
        # the runtime image already carries it; host mode installs on demand
        if: steps.gate.outputs.skip == 'false'
        run: |
          command -v opencode >/dev/null || {
            curl -fsSL https://opencode.ai/install | bash
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          }
      - name: Resolve working model
        id: model
        if: steps.gate.outputs.skip == 'false'
        env:
          MODEL: ${{ inputs.model }}
          FALLBACKS: ${{ inputs.model_fallbacks }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          set -uo pipefail
          IFS=',' read -ra candidates <<< "$MODEL,$FALLBACKS"
          probe="$(mktemp -d)"
          for m in "${candidates[@]}"; do
            m="${m//[[:space:]]/}"
            [ -z "$m" ] && continue
            # `provider/model#variant`: opencode v1 (what the action installs)
            # takes the reasoning effort as --variant, never inside --model
            base="${m%%#*}"; variant=""
            [[ "$m" != *"#"* ]] || variant="${m#*#}"
            echo "probing $m"
            if (cd "$probe" && timeout 120 opencode run --model "$base" ${variant:+--variant "$variant"} 'Reply with exactly: ok') >/dev/null 2>&1; then
              echo "model=$m" >> "$GITHUB_OUTPUT"
              echo "base=$base" >> "$GITHUB_OUTPUT"
              [ -z "$variant" ] || echo "variant=$variant" >> "$GITHUB_OUTPUT"
              echo "using $m"
              exit 0
            fi
            echo "::warning::$m did not respond — trying next candidate"
          done
          echo "::error::no candidate model responded — check provider keys and balances"
          exit 1
      - name: Diagnose failed run
        if: steps.gate.outputs.skip == 'false'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ steps.model.outputs.base }}
          VARIANT: ${{ steps.model.outputs.variant }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ steps.gate.outputs.pr }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # backticks in the format string are literal markdown
          prompt="$(printf 'Workflow run %s ("%s") failed at SHA %s. Diagnose it: run `gh run view %s --log-failed`, find the root cause, and post ONE comment on PR #%s with `gh pr comment %s --body ...`. Format: probable cause, the log evidence, the suggested fix. End the comment with this exact line: <!-- ci-doctor:%s -->. Do not edit code; diagnosis only.' \
            "$RUN_URL" "$RUN_NAME" "$HEAD_SHA" "$RUN_ID" "$PR" "$PR" "$HEAD_SHA")"
          # sed neutralizes workflow commands (`##[error]`, `::error::`) in the
          # failed run's logs so they don't become annotations on THIS run.
          # Unanchored: agent output may prepend ANSI escapes, and the runner
          # strips them before command parsing.
          opencode run --model "$MODEL" ${VARIANT:+--variant "$VARIANT"} --agent ci-doctor "$prompt" 2>&1 \
            | sed -e 's/##\[/## [/g' \
                  -e 's/::\(add-mask\|debug\|error\|warning\|notice\|group\|endgroup\|echo\|stop-commands\)::/:: \1::/g'
      - name: Save refreshed ChatGPT login
        # always: a failed run may still have rotated the refresh token
        if: always() && steps.auth.outcome == 'success'
        env:
          HOST_AUTH: ${{ inputs.use_container && '/gh-agents/auth.json' || vars.AGENT_OPENCODE_AUTH }}
        run: python3 .gh-agents/scripts/opencode_auth.py save "${XDG_DATA_HOME:-$HOME/.local/share}/opencode/auth.json" "$HOST_AUTH"
