name: agents

# Dogfood: this repo reviews its own PRs with the workflow it ships.
# `uses: ./` pins the callee to the same commit — a PR that changes
# agents.yml is reviewed by the changed version, not by @v1.
# Not a merge gate: review comments, a human merges.
#
# runs-on: ubuntu-latest by choice — the repo is public; self-hosted
# runners serve private repos only (AGENTS.md invariant 3).
# No paths-ignore: specs/conventions are the product surface here —
# doc-only PRs get reviewed too.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    # exact workflow names — this filter takes no globs ('*' never matches);
    # keep it in sync with ci_workflows and leave `agents` itself out so a
    # finished run can't retrigger itself
    workflows: ['lint', 'build-runtime']
    types: [completed]

# The reusable callee can only use what is granted here — this is the union
# of its three jobs' permissions.
permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  agents:
    uses: ./.github/workflows/agents.yml
    # the callee's top-level concurrency never applies inside a caller run;
    # group by event + target here so a comment can't race an in-flight
    # review (intrador #1417)
    concurrency:
      # for workflow_run the id is unique per triggering run — the group
      # never collides there; ci-doctor dedup comes from its marker comment
      group: >-
        gh-agents-${{ github.event_name }}-${{ github.event.pull_request.number
        || github.event.issue.number || github.event.workflow_run.id
        || github.ref }}
      cancel-in-progress: true
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
    with:
      runs-on: ubuntu-latest
      model: fireworks-ai/accounts/fireworks/models/glm-5p3-flash
      model_fallbacks: fireworks-ai/accounts/fireworks/models/deepseek-v4p1-flash
      ci_workflows: 'lint,build-runtime'
      # seeds (agents/, skills/, scripts/) from the PR's own branch — callee
      # and config changes get exercised by the PR that changes them.
      # pull_request and review_comment payloads carry pull_request.head;
      # issue_comment on a PR only has issue.pull_request → refs/pull/N/head,
      # which resolves fork heads too (/oc is collaborator-gated). workflow_run
      # and /oc on plain issues fall to 'main'.
      gh_agents_ref: >-
        ${{
          (github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.ref)
          || (github.event.issue.pull_request
            && format('refs/pull/{0}/head', github.event.issue.number))
          || 'main'
        }}
