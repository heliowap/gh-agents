name: agents

# Dogfood: this repo reviews its own PRs with the workflow it ships.
# `uses: ./` pins the callee to the same commit — a PR that changes
# agents.yml is reviewed by the changed version, not by @v1.
# Not a merge gate: review comments, a human merges.
#
# runs-on: ubuntu-latest by choice — the repo is public; self-hosted
# runners serve private repos only (AGENTS.md invariant 3).
# No paths-ignore: specs/conventions are the product surface here —
# doc-only PRs get reviewed too.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    # name the CI workflows and keep it in sync with ci_workflows — '*' is
    # not the dead filter it looks like: on main it behaved as match-all and
    # woke this workflow on every `lint` completion (the callee's `if` then
    # skipped every job). GitHub suppresses a workflow retriggering itself,
    # so `agents` completing never fired this again.
    workflows: ['lint', 'build-runtime']
    types: [completed]

# The reusable callee can only use what is granted here — this is the union
# of its three jobs' permissions.
permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  agents:
    uses: ./.github/workflows/agents.yml
    # the callee's top-level concurrency never applies inside a caller run;
    # key the group by target only — including event_name would put a /oc
    # comment in a different group and let it race the review it followed
    # (intrador #1417). cancel-in-progress: false queues the newer run
    # instead of killing the one in flight. For workflow_run the id is
    # unique per triggering run — the group never collides there; ci-doctor
    # dedup comes from its marker comment.
    concurrency:
      group: >-
        gh-agents-${{ github.event.pull_request.number || github.event.issue.number
        || github.event.workflow_run.id }}
      cancel-in-progress: false
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
    with:
      runs-on: ubuntu-latest
      model: fireworks-ai/accounts/fireworks/models/glm-5p3-flash
      model_fallbacks: fireworks-ai/accounts/fireworks/models/deepseek-v4p1-flash
      ci_workflows: 'lint,build-runtime'
      # seeds (agents/, skills/, scripts/) from the PR's own branch — callee
      # and config changes get exercised by the PR that changes them.
      # pull_request and review_comment payloads carry pull_request.head;
      # issue_comment on a PR only has issue.pull_request → refs/pull/N/head
      # (issue.number == PR number — shared sequence), which resolves fork
      # heads too (/oc is collaborator-gated). workflow_run and /oc on
      # plain issues fall to 'main'.
      gh_agents_ref: >-
        ${{
          (github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.ref)
          || (github.event.issue.pull_request
            && format('refs/pull/{0}/head', github.event.issue.number))
          || 'main'
        }}
