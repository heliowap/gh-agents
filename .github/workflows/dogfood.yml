name: agents

# Dogfood: this repo reviews its own PRs with the workflow it ships.
# `uses: ./` pins the callee to the same commit — a PR that changes
# agents.yml is reviewed by the changed version, not by @v1.
# Not a merge gate: review comments, a human merges.
#
# runs-on: ubuntu-latest by choice — the repo is public; self-hosted
# runners serve private repos only (AGENTS.md invariant 3).
# No paths-ignore: specs/conventions are the product surface here —
# doc-only PRs get reviewed too.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    # exact workflow names, kept in sync with ci_workflows — `on:` can't
    # read expressions, so this list alone decides when ci-doctor wakes
    workflows: ['lint', 'build-runtime']
    types: [completed]

# The reusable callee can only use what is granted here — this is the union
# of its three jobs' permissions.
permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  agents:
    uses: ./.github/workflows/agents.yml
    # the callee's top-level concurrency never applies inside a caller run;
    # group by event + target here: with one group per PR, any comment —
    # another app's included — cancelled the in-flight review (intrador
    # #1417, run 34868746805). A queued run is replaced by the next arrival,
    # so a target-only group would let a plain comment drop a pending review.
    concurrency:
      # for workflow_run the id is unique per triggering run — the group
      # never collides there; ci-doctor dedup comes from its marker comment
      group: >-
        gh-agents-${{ github.event_name }}-${{ github.event.pull_request.number
        || github.event.issue.number || github.event.workflow_run.id
        || github.ref }}
      cancel-in-progress: true
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
    with:
      runs-on: ubuntu-latest
      model: fireworks-ai/accounts/fireworks/models/glm-5p3-flash
      model_fallbacks: fireworks-ai/accounts/fireworks/models/deepseek-v4p1-flash
      ci_workflows: 'lint,build-runtime'
      # seeds (agents/, skills/, scripts/) from the PR's own branch when it
      # lives in this repo — callee and config changes get exercised by the
      # PR that changes them. Never a fork head: the fix job copies the seed
      # opencode.json to the root (this repo has none), and a fork could
      # declare a local MCP command that runs with the provider keys and a
      # contents: write token. issue_comment carries no head repo, so
      # comment-triggered runs, workflow_run and forks all seed from 'main'.
      gh_agents_ref: >-
        ${{
          (github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.ref)
          || 'main'
        }}
