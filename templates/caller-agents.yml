name: agents

# Enables gh-agents on this repo: PR review, `/oc` fix, CI diagnosis.
# Onboarding checklist: https://github.com/heliowap/gh-agents#onboarding

on:
  pull_request:
    # set this to the repo's default branch
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    # set this to your CI workflow names — the filter takes exact names and
    # `on:` can't read expressions, so this list is what decides when
    # ci-doctor wakes; keep it in sync with ci_workflows. Leaving 'ci' on a
    # repo whose CI has another name means ci-doctor silently never fires.
    workflows: ['ci']
    types: [completed]

# The reusable callee can only use what is granted here — this is the union
# of its three jobs' permissions.
permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  agents:
    uses: heliowap/gh-agents/.github/workflows/agents.yml@v1
    # the callee's top-level concurrency never applies inside a caller run;
    # key the group by target only — including event_name would put a /oc
    # comment in a different group and let it race the review it followed
    # (intrador #1417). cancel-in-progress: false queues the newer run
    # instead of killing the one in flight. For workflow_run the id is
    # unique per triggering run — the group never collides there.
    concurrency:
      group: >-
        gh-agents-${{ github.event.pull_request.number || github.event.issue.number
        || github.event.workflow_run.id }}
      cancel-in-progress: false
    # `inherit` only passes secrets to a reusable workflow of the same owner
    # (org or enterprise). Repos outside `heliowap` map them explicitly — with
    # `inherit` the key arrives empty and the preflight fails:
    #   secrets:
    #     OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    #     FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
    secrets: inherit
    # with:
    #   runs-on: self-hosted        # default; vars.AGENT_RUNNER overrides per repo
    #   model: opencode-go/glm-5.3-flash
    #   model_fallbacks: 'a/1,b/2'  # probed in order; first responding model wins
    #   use_container: true         # false = run on host (tests needing Docker)
    #   ci_workflows: 'ci,qe'       # empty = watch all failed runs
